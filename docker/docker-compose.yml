name: ecommerce-lakehouse

# Shared settings -------------------------------------------------------------
x-lake-env: &lake-env
  LAKE_ROOT: /opt/lake
  REFERENCE_DIR: /opt/project/reference_data
  SPARK_SHUFFLE_PARTITIONS: "8"

x-project-mounts: &project-mounts
  - ../lakehouse:/opt/project/lakehouse:ro
  - ../reference_data:/opt/project/reference_data:ro
  - ../lake:/opt/lake

x-spark: &spark
  build:
    context: ..
    dockerfile: docker/spark/Dockerfile
  image: ecommerce-lakehouse-spark:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    <<: *lake-env
  volumes: *project-mounts
  restart: unless-stopped

x-airflow: &airflow
  build:
    context: ..
    dockerfile: docker/airflow/Dockerfile
  image: ecommerce-lakehouse-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    <<: *lake-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-development-only}
    PROJECT_DIR: /opt/project
    SPARK_MASTER_URL: spark://spark-master:7077
    SPARK_DRIVER_HOST: airflow-scheduler
    FRESHNESS_MINUTES: "30"
  volumes:
    - ../airflow/dags:/opt/airflow/dags:ro
    - ../lakehouse:/opt/project/lakehouse:ro
    - ../reference_data:/opt/project/reference_data:ro
    - ../lake:/opt/lake
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  # Event generator: replays history, then writes live store events into the landing zone.
  event-generator:
    build:
      context: ..
      dockerfile: docker/generator/Dockerfile
    image: ecommerce-lakehouse-generator:local
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      LANDING_DIR: /opt/lake/landing
      BACKFILL_DAYS: ${BACKFILL_DAYS:-30}
      LIVE_RATE_MULTIPLIER: ${LIVE_RATE_MULTIPLIER:-30}
      GENERATOR_STATE_FILE: /opt/lake/_generator_state.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../lake:/opt/lake
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Spark ------------------------------------------------------------------------
  spark-master:
    <<: *spark
    hostname: spark-master
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 12

  spark-worker:
    <<: *spark
    hostname: spark-worker
    command: >
      spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
      --cores ${SPARK_WORKER_CORES:-4} --memory ${SPARK_WORKER_MEMORY:-4g}
      --webui-port 8081 --work-dir /tmp/spark-work
    ports:
      - "127.0.0.1:${SPARK_WORKER_UI_PORT:-8091}:8081"
    depends_on:
      spark-master:
        condition: service_healthy

  # Bronze: an always-on Structured Streaming job from the landing zone into Delta.
  spark-streaming:
    <<: *spark
    hostname: spark-streaming
    command: >
      spark-submit --master local[2] --driver-memory 1g --name bronze_streaming
      /opt/project/lakehouse/run.py bronze
    ports:
      - "127.0.0.1:${SPARK_STREAMING_UI_PORT:-4040}:4040"
    environment:
      <<: *lake-env
      BRONZE_TRIGGER_INTERVAL: ${BRONZE_TRIGGER_INTERVAL:-20 seconds}
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow: orchestrates Silver, the quality gate and Gold on the Spark cluster ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /opt/lake/landing /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/lake /opt/airflow/logs
        /entrypoint airflow version
        /entrypoint airflow pools set spark 3 "Concurrent Spark applications on the cluster"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    restart: unless-stopped

  # Dashboard + AI analyst ------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    image: ecommerce-lakehouse-app:local
    environment:
      LAKE_ROOT: /opt/lake
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
    volumes:
      - ../lake:/opt/lake
    ports:
      - "127.0.0.1:${AI_SERVER_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
