  <rect class="airflow" x="560" y="22" width="420" height="262" rx="14"/>
  <text class="airflow-label" x="576" y="44">Airflow · every 10 min · Spark cluster</text>
  <g class="edge">
    <path d="M120 105 H148"/><path d="M250 105 H278"/><path d="M395 105 H423"/><path d="M530 105 H573"/>
    <path d="M685 105 H713"/><path d="M815 105 H843"/><path d="M900 140 V303"/>
  </g>
  <path class="edge dashed" d="M630 140 V203"/>
  <g class="node"><rect x="10" y="70" width="110" height="70" rx="10"/>
    <text x="65" y="100">Event</text><text x="65" y="118">generator</text></g>
  <g class="node landing"><rect x="150" y="70" width="100" height="70" rx="10"/>
