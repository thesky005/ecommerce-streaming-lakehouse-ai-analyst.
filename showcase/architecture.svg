  <g class="node spark"><rect x="280" y="70" width="115" height="70" rx="10"/>
    <text x="337" y="98">Spark</text><text x="337" y="115" class="sub">Structured</text>
    <text x="337" y="130" class="sub">Streaming</text></g>
  <g class="node bronze"><rect x="425" y="70" width="105" height="70" rx="10"/>
    <text x="477" y="100">Bronze</text><text x="477" y="118" class="sub">raw Delta</text></g>
  <g class="node silver"><rect x="575" y="70" width="110" height="70" rx="10"/>
