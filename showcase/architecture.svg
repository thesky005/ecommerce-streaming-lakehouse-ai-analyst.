<svg viewBox="0 0 1000 370" role="img" aria-label="Architecture: event generator, landing zone, Spark Structured Streaming,
 Bronze, Silver with quarantine, quality gate, Gold and the dashboard with the AI analyst; Airflow orchestrates Silver to Gold">
